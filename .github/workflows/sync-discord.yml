name: Sincronizar calendario con Discord

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer eventos de Discord
        run: node scripts/sync-discord.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || '1500922112020447234' }}
      - name: Guardar si hay cambios
        run: |
          git config user.name "atelier-bot"
          git config user.email "atelier-bot@users.noreply.github.com"
          git add eventos.json taller.json 2>/dev/null || git add eventos.json
          git diff --cached --quiet || git commit -m "Calendario y rangos actualizados desde Discord"
          git push
